<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快樂！🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    height: 100vh;
    font-family: "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    display: flex;
    justify-content: center;
    align-items: center;
    color: rgb(124, 52, 52);
}

/* 背景星星 */
.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    color: white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.3); }
}

/* 主卡片 */
.card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 25px;
    width: 90%;
    max-width: 450px;
    border-radius: 30px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 10px 40px rgba(255,255,255,0.2);
    animation: appear 1.2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(50px) scale(0.8);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

h1 {
    font-size: 35px;
    margin-bottom: 15px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 5px white; }
    to { text-shadow: 0 0 25px #fff, 0 0 40px #ff69b4; }
}

/* 蛋糕 */
.cake {
    font-size: 100px;
    margin: 15px 0;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

.message {
    font-size: 18px;
    line-height: 2;
    min-height: 90px;
    margin: 15px 0;
}

/* 按鈕 */
button {
    border: none;
    padding: 14px 28px;
    border-radius: 50px;
    background: #ff5e9c;
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 5px 15px #ff5e9c80;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ff3385;
}

/* 氣球 */
.balloon {
    position: fixed;
    bottom: -100px;
    font-size: 45px;
    animation: floatUp linear forwards;
    z-index: 1;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-120vh) rotate(20deg);
        opacity: 0;
    }
}

/* 彩帶 */
.confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 15px;
    z-index: 10;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

.footer {
    margin-top: 20px;
    font-size: 14px;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="card">
    <h1>🎉 生日快樂 🎉</h1>

    <div class="cake">🎂</div>

    <div class="message" id="message"></div>

    <button onclick="celebrate()">🎁 點我領取祝福</button>

    <div class="footer">
        ✨ 願你每天都開開心心 ✨
    </div>
</div>

<script>

// 產生星星
for (let i = 0; i < 50; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.innerHTML = "✦";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.fontSize = Math.random() * 15 + 8 + "px";
    star.style.animationDelay = Math.random() * 2 + "s";

    document.getElementById("stars").appendChild(star);
}

// 逐字顯示祝福
const text = "祝你生日快樂！🎂\n願所有美好的事情都發生在你身上，天天開心，夢想成真！💖";

let index = 0;

function typeWriter() {
    if (index < text.length) {
        const char = text[index];

        if (char === "\n") {
            document.getElementById("message").innerHTML += "<br>";
        } else {
            document.getElementById("message").innerHTML += char;
        }

        index++;
        setTimeout(typeWriter, 100);
    }
}

typeWriter();

// 氣球動畫
function createBalloon() {
    const balloon = document.createElement("div");
    balloon.className = "balloon";

    const balloons = ["🎈", "🎈", "💖", "🎈", "🌸"];
    balloon.innerHTML = balloons[Math.floor(Math.random() * balloons.length)];

    balloon.style.left = Math.random() * 100 + "vw";
    balloon.style.animationDuration = (Math.random() * 4 + 5) + "s";

    document.body.appendChild(balloon);

    setTimeout(() => balloon.remove(), 9000);
}

setInterval(createBalloon, 800);

// 點擊按鈕：彩帶大爆發
function celebrate() {
    for (let i = 0; i < 120; i++) {
        const confetti = document.createElement("div");
        confetti.className = "confetti";

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
            `hsl(${Math.random() * 360}, 100%, 60%)`;

        confetti.style.animationDuration =
            (Math.random() * 2 + 2) + "s";

        confetti.style.animationDelay =
            Math.random() * 1 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
    }

    alert("🎉 生日快樂！願你幸福快樂，所有願望都實現！🎉");
}

</script>

</body>
</html>
